<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas de Asistencia</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dashboard de Asistencia</h1>
            <div class="controls">
                <select id="queryType">
                    <option value="general">Resumen General</option>
                    <option value="sector">Asistencia por Sector</option>
                    <option value="fecha">Tendencia por Fecha</option>
                </select>
                <button onclick="updateDashboard()">Actualizar</button>
            </div>
        </header>

        <main>
            <div class="stats-grid">
                <div class="card">
                    <h3>Total Registros</h3>
                    <p id="totalCount">-</p>
                </div>
                <div class="card">
                    <h3>Estado del Sistema</h3>
                    <p id="systemStatus" style="color: #27ae60;">Activo</p>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="statsChart"></canvas>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
